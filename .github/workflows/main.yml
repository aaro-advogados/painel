name: Atualizar painel
 
on:
  schedule:
    # 08h às 17h de Brasília (11h–20h UTC), segunda a sexta
    - cron: '7,22,37,52 11-20 * * 1-5'
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Atualizar mesmo em feriado ou fim de semana'
        type: boolean
        default: true
 
permissions:
  contents: write
  pages: write
  id-token: write
 
concurrency:
  group: painel
  cancel-in-progress: false
 
jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Buscar dados e montar o painel
        id: build
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          FORCAR: ${{ github.event_name == 'workflow_dispatch' && inputs.forcar }}
        run: cp atualizar.js montar.js painel-aaro-github/painel/ && node painel-aaro-github/painel/atualizar.js
      - uses: actions/configure-pages@v5
        if: steps.build.outputs.pular != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.pular != 'true'
        with:
          path: painel-aaro-github/site
      - name: Publicar
        id: deploy
        if: steps.build.outputs.pular != 'true'
        uses: actions/deploy-pages@v4
      - name: Manter o agendamento ativo (1 registro por dia)
        if: steps.build.outputs.pular != 'true'
        run: |
          hoje=$(TZ=America/Sao_Paulo date +%F)
          if [ "$(cat ultima-atualizacao.txt 2>/dev/null)" != "$hoje" ]; then
            echo "$hoje" > ultima-atualizacao.txt
            git config user.name "painel-bot"
            git config user.email "painel-bot@users.noreply.github.com"
            git add ultima-atualizacao.txt
            git commit -m "Atualização $hoje"
            git push
          fi
 
